<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Highlight-to-Define demo</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 700px;
    margin: 60px auto;
    line-height: 1.6;
    color: #222;
  }
  h1 {
    font-size: 1.1rem;
    color: #555;
    font-weight: 600;
  }
  #note {
    font-size: 1.15rem;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    user-select: text;
  }
  #define-btn {
    position: absolute;
    display: none;
    padding: 6px 12px;
    background: #222;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    z-index: 10;
  }
  #define-btn:hover {
    background: #444;
  }
  #result {
    margin-top: 24px;
    padding: 16px;
    border-radius: 8px;
    background: #eef6ff;
    border: 1px solid #cfe3fb;
    display: none;
    white-space: pre-wrap;
  }
  #result.error {
    background: #fdeeee;
    border-color: #f3c6c6;
  }
  #status {
    margin-top: 8px;
    font-size: 0.85rem;
    color: #888;
  }
</style>
</head>
<body>

<h1>Highlight some text below, then click "Define"</h1>

<p id="note">
  Cellular respiration is the process by which cells break down glucose to
  release energy stored in its chemical bonds, occurring in three main
  stages: glycolysis, the citric acid cycle, and oxidative phosphorylation.
</p>

<button id="define-btn">Define</button>
<div id="result"></div>
<div id="status"></div>

<script>
  // Backend URL -- change this if your FastAPI server runs somewhere else.
  const API_URL = "http://localhost:8000/api/define";

  const note = document.getElementById("note");
  const defineBtn = document.getElementById("define-btn");
  const resultBox = document.getElementById("result");
  const statusBox = document.getElementById("status");

  let lastSelectedText = "";

  // GOAL (step 1): detect when the user highlights text inside #note, and
  // show the floating "Define" button right next to what they selected.
  // No library needed -- this is entirely the browser's built-in Selection
  // API.
  //
  // TODO: add a "mouseup" listener on `document`. Inside it:
  //   - get the current selection object: window.getSelection()
  //   - get the selected text as a string, trimmed: selection.toString().trim()
  //   - make sure the selection is actually inside `note`, not somewhere
  //     else on the page (check selection.anchorNode and note.contains(...))
  //   - if there's no text, or it's not inside `note`: hide defineBtn
  //     (defineBtn.style.display = "none") and stop
  //   - otherwise: save the text into `lastSelectedText`, figure out where
  //     on screen the selection is (selection.getRangeAt(0).getBoundingClientRect()),
  //     position defineBtn there via its .style.left / .style.top, and show
  //     it (defineBtn.style.display = "block")


  // GOAL (step 2): when the button is clicked, send lastSelectedText to the
  // backend and show what comes back.
  //
  // TODO: add a "click" listener on defineBtn. Inside it:
  //   - bail out early if lastSelectedText is empty
  //   - hide defineBtn, hide/reset resultBox, set statusBox to something
  //     like "Asking the model..." so there's feedback while it's loading
  //   - fetch(API_URL, { method: "POST", headers: {"Content-Type":
  //     "application/json"}, body: JSON.stringify({ text: lastSelectedText }) })
  //   - await response.json() to get the parsed body
  //   - if response.ok is false, throw an Error using the "detail" field
  //     from the backend's error response (that's what FastAPI's
  //     HTTPException sends back)
  //   - otherwise, show data.definition in resultBox and data.model in
  //     statusBox
  //   - wrap the fetch + handling in try/catch so a backend/Ollama failure
  //     shows up as a message in resultBox instead of failing silently --
  //     check the browser console if something isn't working
</script>

</body>
</html>
